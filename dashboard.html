<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Aim Shoot Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <header>
      <h1>Load Aim Shoot Dashboard</h1>
    </header>
    
    <section class="stats">
      <div class="stat-card">
        <h3>Total Focus Time</h3>
        <p id="totalFocusTime">0 minutes</p>
      </div>
      <div class="stat-card">
        <h3>Distractions Prevented</h3>
        <p id="distractionsPrevented">0</p>
      </div>
      <div class="stat-card">
        <h3>Current Streak</h3>
        <p id="streaks">0 days</p>
      </div>
    </section>
    
    <section class="charts">
      <div class="chart-container">
        <h3>Daily Focus Overview</h3>
        <canvas id="focusChart"></canvas>
      </div>
      <div class="chart-container">
        <h3>Top Distractions</h3>
        <canvas id="distractionsChart"></canvas>
      </div>
    </section>
    
    <section class="habits">
      <h2>Focus Habits</h2>
      <div id="habits-list"></div>
      
      <form id="habit-form">
        <h3>Add New Habit</h3>
        <br>
        <div class="form-group">
          <label for="habit-name">Habit Name</label>
          <input type="text" id="habit-name" required>
        </div>
        <div class="form-group">
          <label for="habit-start">Start Time</label>
          <input type="time" id="habit-start" required>
        </div>
        <div class="form-group">
          <label for="habit-end">End Time</label>
          <input type="time" id="habit-end" required>
        </div>
        <button type="submit">Add Habit</button>
      </form>
    </section>
  </div>
  
  <!-- Load scripts at the end of body to ensure DOM is loaded -->
  <script src="chart.umd.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
